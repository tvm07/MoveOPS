<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoveOPS</title>

<link rel="stylesheet" href="styles.css">

<!-- Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js" defer></script>

<!-- App -->
<script src="app.js" defer></script>
</head>

<body>

<!-- HEADER -->
<header class="app-header">

  <div class="brand">
    <h1>MoveOPS</h1>
    <small>Control en vivo de lanzadera</small>
  </div>

  <div class="user-area">
    <span id="userInfo"></span>
    <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
  </div>

</header>


<main>

<!-- FORMULARIO -->
<section class="card form-section">

  <div id="contenedorFormulario" class="form-collapsible">

    <form id="formulario" class="form-linea">

      <div class="field-inline">
        <label>Unidad</label>
        <select id="unidad" required></select>
      </div>

      <div class="field-inline">
        <label>Hora</label>
        <input type="time" id="hora" required>
      </div>

      <div class="field-inline">
        <label>Zona</label>
        <select id="zona" required></select>
      </div>

      <div class="field-inline">
        <label>Hotel</label>
        <input type="text" id="hotel" list="listaHoteles" required>
        <datalist id="listaHoteles"></datalist>
      </div>

      <div class="field-inline">
        <label>Cuenta</label>
        <select id="cuenta">
          <option value="Nexus">Nexus</option>
          <option value="Nexus DV">Nexus RF</option>
          <option value="Consolidados">Consolidados</option>
          <option value="Abordo">Abordo</option>
        </select>
      </div>

      <div class="field-inline">
        <label>Servicio</label>
        <select id="servicio">
          <option value="SALIDA">Salida</option>
          <option value="LLEGADA">Llegada</option>
          <option value="INTERZONA">Interzona</option>
          <option value="ABIERTO">Abierto</option>
        </select>
      </div>

      <button type="submit">Agregar unidad</button>

    </form>

  </div>
</section>


<!-- LISTA -->
<section class="card table-section">

  <div class="section-title">
    <h2>Unidades en lanzadera</h2>

    <div class="filtros">

      <select id="filtroZona">
        <option value="">Todas las zonas</option>
      </select>

      <select id="filtroCuenta">
        <option value="">Todas</option>
        <option value="Nexus">Nexus</option>
        <option value="Nexus DV">Nexus DV</option>
        <option value="Consolidados">Consolidados</option>
        <option value="Abordo">Abordo</option>
      </select>

      <button id="btnExportar">Excel</button>

    </div>
  </div>

  <div class="table-container">
    <table id="tablaRegistros">
      <thead>
        <tr>
          <th>#</th>
          <th>Registro</th>
          <th>Unidad</th>
          <th>Hora</th>
          <th>Zona</th>
          <th>Hotel</th>
          <th>Cuenta</th>
          <th>Tipo</th>
          <th>Tiempo</th>
          <th>Trayecto</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</section>

</main>

</body>
</html>
